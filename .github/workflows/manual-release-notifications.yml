name: Manual release notifications

on:
  workflow_dispatch:
    inputs:
      release_set:
        description: "Release set to announce"
        required: true
        type: choice
        options:
          - latest-all
          - pc-range
        default: latest-all
      after_tag:
        description: "For pc-range: last announced PC tag, excluded (for example v6.6.21)"
        required: false
        type: string
      through_tag:
        description: "For pc-range: last PC tag to announce, included (blank uses latest)"
        required: false
        type: string
      dry_run:
        description: "Prepare the notification preview without sending"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-notifications
  cancel-in-progress: false

jobs:
  notify:
    name: Send existing release notes to Discord
    runs-on: ubuntu-latest
    steps:
      - name: Checkout notification sender
        uses: actions/checkout@v7

      - name: Prepare published release notifications
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SET: ${{ inputs.release_set }}
          RELEASE_AFTER_TAG: ${{ inputs.after_tag }}
          RELEASE_THROUGH_TAG: ${{ inputs.through_tag }}
          RELEASE_NOTIFICATION_DIR: ${{ runner.temp }}/release-notifications
        run: node .github/scripts/prepare_release_notifications.mjs prepare

      - name: Upload notification preview
        uses: actions/upload-artifact@v7
        with:
          name: release-notification-preview
          path: ${{ runner.temp }}/release-notifications
          if-no-files-found: error

      - name: Send and verify existing release notifications
        if: ${{ inputs.dry_run == false }}
        env:
          RELEASE_WEBHOOK_URL: ${{ secrets.RELEASE_NOTES_WEBHOOK_URL }}
          RELEASE_NOTIFICATION_DIR: ${{ runner.temp }}/release-notifications
        run: node .github/scripts/prepare_release_notifications.mjs send

      - name: Upload delivery receipts
        if: ${{ always() && inputs.dry_run == false }}
        uses: actions/upload-artifact@v7
        with:
          name: release-notification-receipts
          path: ${{ runner.temp }}/release-notifications/receipts.json
          if-no-files-found: warn
